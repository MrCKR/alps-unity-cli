interface:
  display_name: "UnityCLI Issue Lifecycle"
  short_description: "Track source-first UnityCLI defect resolution"
  default_prompt: "Use $unity-cli-issue-lifecycle to register this UnityCLI defect before changing canonical product source, implement and validate the final source semantics, install them into an authorized test Package when applicable, and archive only after all required automation, contracts, Live matrices, and gates pass."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "path_scoped"
    paths:
      - ".issues/**"
      - "unitypkg/**"
      - "**/Packages/com.alpsckr.unitycli/**"
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
